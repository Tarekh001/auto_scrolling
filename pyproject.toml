[project]
name = "auto-scrolling"
version = "0.1.0"
description = "Touchless hand-gesture controller for Windows desktop applications (TikTok, Instagram, etc.)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mediapipe>=0.10.14",
    "opencv-python>=4.9.0",
    "pyautogui>=0.9.54",
]

[project.scripts]
auto-scroll = "auto_scrolling.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_scrolling"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
